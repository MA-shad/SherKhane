<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>تست API دیوان | شعرخانه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:Vazirmatn,Tahoma,sans-serif}</style>
</head>
<body class="min-h-screen bg-amber-50 p-5 text-slate-800 sm:p-8">
  <main class="mx-auto max-w-5xl">
    <header class="mb-8 border-b border-amber-200 pb-5">
      <p class="mb-2 text-sm font-semibold text-amber-800">ابزار توسعه</p>
      <h1 class="text-2xl font-bold text-amber-950 sm:text-3xl">تست زنده API شعرخانه</h1>
      <p class="mt-2 text-sm leading-7 text-slate-600">این صفحه مستقل از رابط اصلی است و فقط برای بررسی پاسخ‌های Django REST Framework استفاده می‌شود.</p>
    </header>

    <section class="mb-6 flex flex-wrap gap-3">
      <button id="load-poets" class="rounded-lg bg-amber-800 px-5 py-3 text-sm font-semibold text-white hover:bg-amber-900">دریافت شاعران</button>
      <button id="load-poems" class="rounded-lg bg-emerald-800 px-5 py-3 text-sm font-semibold text-white hover:bg-emerald-900">دریافت اشعار</button>
    </section>

    <p id="status" class="mb-5 hidden rounded-lg p-4 text-sm leading-7" role="status" aria-live="polite"></p>
    <section id="results" class="grid gap-4 md:grid-cols-2" aria-label="نتایج API">
      <div class="col-span-full rounded-xl border border-dashed border-amber-300 bg-white/60 p-10 text-center text-sm text-slate-500">برای شروع یکی از دکمه‌ها را انتخاب کن.</div>
    </section>
    <nav id="pagination" class="mt-6 flex items-center justify-between gap-3" aria-label="صفحه‌بندی"></nav>
  </main>

  <script>
    const API_BASE = (window.SHERKHANE_API_BASE_URL || "http://127.0.0.1:8000/api").replace(/\/+$/, "");
    const statusElement = document.querySelector("#status");
    const resultsElement = document.querySelector("#results");
    const paginationElement = document.querySelector("#pagination");
    let currentResource = "poets";
    let currentPage = 1;

    function showStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.className = `mb-5 rounded-lg p-4 text-sm leading-7 ${isError ? "bg-red-100 text-red-800" : "bg-amber-100 text-amber-900"}`;
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    async function request(path) {
      let response;
      try {
        response = await fetch(`${API_BASE}${path}`, { headers: { Accept: "application/json" } });
      } catch {
        throw new Error("اتصال به Django برقرار نشد. مطمئن شو سرویس backend در Docker روشن است.");
      }
      let payload;
      try { payload = await response.json(); }
      catch { throw new Error(`پاسخ API قابل‌خواندن نیست (${response.status}).`); }
      if (!response.ok) throw new Error(payload.detail || `درخواست با وضعیت ${response.status} ناموفق بود.`);
      return payload;
    }

    function normalizeCollection(payload) {
      if (Array.isArray(payload)) return { results: payload, count: payload.length, next: null, previous: null };
      if (payload && Array.isArray(payload.results)) return payload;
      throw new Error("فرمت پاسخ فهرست با Pagination فعلی DRF سازگار نیست.");
    }

    function renderPagination(pageData) {
      paginationElement.replaceChildren();
      const previous = makeElement("button", "rounded border border-amber-300 px-4 py-2 text-sm disabled:opacity-40", "صفحه قبل");
      previous.disabled = !pageData.previous;
      previous.addEventListener("click", () => loadResource(currentResource, currentPage - 1));
      const pageLabel = makeElement("span", "text-xs text-slate-500", `صفحه ${new Intl.NumberFormat("fa-IR").format(currentPage)} · ${new Intl.NumberFormat("fa-IR").format(pageData.count)} مورد`);
      const next = makeElement("button", "rounded border border-amber-300 px-4 py-2 text-sm disabled:opacity-40", "صفحه بعد");
      next.disabled = !pageData.next;
      next.addEventListener("click", () => loadResource(currentResource, currentPage + 1));
      paginationElement.append(previous, pageLabel, next);
    }

    function renderPoets(poets) {
      resultsElement.replaceChildren();
      if (!poets.length) { resultsElement.append(makeElement("p", "col-span-full p-8 text-center text-slate-600", "شاعری در این صفحه پیدا نشد.")); return; }
      for (const poet of poets) {
        const card = makeElement("article", "rounded-xl border border-amber-200 bg-white p-5 shadow-sm");
        card.append(makeElement("h2", "text-lg font-bold text-amber-950", poet.name || "نام ثبت نشده"));
        card.append(makeElement("p", "mt-2 text-xs text-amber-800", poet.century ? `قرن ${poet.century}` : "دوره تاریخی نامشخص"));
        card.append(makeElement("p", "mt-3 text-sm leading-7 text-slate-600", poet.bio || "زندگی‌نامه ثبت نشده است."));
        if (Array.isArray(poet.works)) card.append(makeElement("p", "mt-3 border-t border-amber-100 pt-3 text-xs text-slate-500", `${new Intl.NumberFormat("fa-IR").format(poet.works.length)} اثر متصل`));
        resultsElement.append(card);
      }
    }

    async function loadPoemDetail(id, card) {
      const button = card.querySelector("button");
      button.disabled = true;
      button.textContent = "در حال دریافت…";
      try {
        const poem = await request(`/poems/${id}/`);
        const verses = Array.isArray(poem.verses) ? poem.verses : [];
        const verseList = makeElement("div", "mt-4 space-y-2 border-t border-amber-100 pt-3");
        for (const verse of verses) {
          const row = makeElement("div", "grid gap-2 rounded bg-amber-50 p-3 text-center text-sm leading-7 sm:grid-cols-2");
          row.append(makeElement("p", "m-0", verse.first_couplet || ""), makeElement("p", "m-0", verse.second_couplet || ""));
          verseList.append(row);
        }
        if (!verses.length) verseList.append(makeElement("p", "text-xs text-slate-500", "برای این شعر بیتی ثبت نشده است."));
        card.append(verseList);
        button.remove();
      } catch (error) {
        button.disabled = false;
        button.textContent = "تلاش دوباره برای دریافت ابیات";
        showStatus(error.message, true);
      }
    }

    function renderPoems(poems) {
      resultsElement.replaceChildren();
      if (!poems.length) { resultsElement.append(makeElement("p", "col-span-full p-8 text-center text-slate-600", "شعری در این صفحه پیدا نشد.")); return; }
      for (const poem of poems) {
        const card = makeElement("article", "col-span-full rounded-xl border border-amber-200 bg-white p-5 shadow-sm");
        card.append(makeElement("h2", "text-lg font-bold text-amber-950", poem.title || "عنوان ثبت نشده"));
        card.append(makeElement("p", "mt-2 text-xs text-slate-600", [poem.poet_name, poem.poem_type, poem.rhythm_name].filter(Boolean).join(" · ") || "اطلاعات تکمیلی ثبت نشده"));
        const button = makeElement("button", "mt-4 rounded bg-emerald-800 px-4 py-2 text-xs font-semibold text-white hover:bg-emerald-900", "دریافت جزئیات و ابیات");
        button.addEventListener("click", () => loadPoemDetail(poem.id, card));
        card.append(button);
        resultsElement.append(card);
      }
    }

    async function loadResource(resource, page = 1) {
      currentResource = resource;
      currentPage = Math.max(1, page);
      resultsElement.replaceChildren(makeElement("p", "col-span-full p-8 text-center text-slate-500", "در حال دریافت اطلاعات…"));
      paginationElement.replaceChildren();
      showStatus("در حال ارسال درخواست به API…");
      try {
        const params = new URLSearchParams();
        if (currentPage > 1) params.set("page", String(currentPage));
        const query = params.size ? `?${params.toString()}` : "";
        const pageData = normalizeCollection(await request(`/${resource}/${query}`));
        showStatus(`دریافت ${new Intl.NumberFormat("fa-IR").format(pageData.results.length)} مورد از ${new Intl.NumberFormat("fa-IR").format(pageData.count)} مورد با موفقیت انجام شد.`);
        if (resource === "poets") renderPoets(pageData.results);
        else renderPoems(pageData.results);
        renderPagination(pageData);
      } catch (error) {
        resultsElement.replaceChildren();
        showStatus(error.message, true);
      }
    }

    document.querySelector("#load-poets").addEventListener("click", () => loadResource("poets"));
    document.querySelector("#load-poems").addEventListener("click", () => loadResource("poems"));
  </script>
</body>
</html>
