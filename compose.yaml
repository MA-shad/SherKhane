services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sherkhane}
      POSTGRES_USER: ${POSTGRES_USER:-sherkhane_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - sherkhane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sherkhane_app} -d ${POSTGRES_DB:-sherkhane}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sherkhane_pgdata: